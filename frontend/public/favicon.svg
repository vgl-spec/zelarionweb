<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Zelarion">
  <title>Zelarion</title>
  <!-- The brand mark is a faceted Z in three planes. Detail is deliberately coarse:
       this renders at 16px in a tab, where thin facets and bevels turn to mud. -->
  <defs>
    <linearGradient id="z" x1="8" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2BC8B7" />
      <stop offset="0.5" stop-color="#22B8F0" />
      <stop offset="1" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Dark ground so the mark holds contrast against both light and dark browser chrome. -->
  <rect width="64" height="64" rx="14" fill="#05070A" />

  <g fill="url(#z)">
    <!-- Upper-left wedge -->
    <path d="M11 14 L38 16 L24 33 Z" />
    <!-- The diagonal stroke -->
    <path d="M42 15 L55 17 L22 49 L11 47 Z" />
    <!-- Lower-right wedge -->
    <path d="M35 51 L50 33 L57 51 Z" />
  </g>
</svg>
